/* Layout: full-screen tour; title card top-left; floor-plan navigator bottom-left with live view cone; doorway labels in the scene. */
:root{--ground:#f5f3ef;--ink:#2b3038;--muted:#6c7179;--line:#e7e3dc;--accent:#c2a256;--gold-ink:#8a6d2c;--glass:rgba(255,255,255,.88);
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--f-num:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;color-scheme:light}   /* same look as the approved residence-aurea page */
html,body{height:100%;margin:0}body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#pano{position:fixed;inset:0}.pnlm-container{background:var(--ground)!important}
.card{position:fixed;z-index:5;background:var(--glass);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(20,22,26,.12)}
.title{left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:10px 13px;display:grid;gap:3px;max-width:calc(100% - 32px)}
.title h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.05;letter-spacing:-.005em}.title p{margin:0;font-size:12px;color:var(--muted)}
.title img{height:26px;width:auto;display:block;margin-bottom:4px}
.flats{display:flex;gap:2px;margin-top:6px;padding:2px;background:rgba(43,48,56,.07);border-radius:7px;width:max-content}
.flats a{font:500 12px var(--f-ui);color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:5px;white-space:nowrap;min-height:28px;display:flex;align-items:center}
.flats a[aria-current]{background:#fff;box-shadow:0 1px 4px rgba(20,22,26,.14);font-weight:600}.flats a:not([aria-current]):hover{background:rgba(255,255,255,.6)}
.flats a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}   /* 2026-11-06 Lenny: no flat menu first; open 4.1, switch to 3.5 right next to it */
#room{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.map{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:8px;width:min(260px,calc(100% - 32px))}
.map .wrap{position:relative;width:100%}.map img{display:block;width:100%;height:auto}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:pointer;padding:0}
.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.dot.on{background:var(--accent);border-color:#fff}
#cone{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;transform-origin:50% 50%}
.go{background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink);font-family:var(--f-ui);font-size:13px;font-weight:500;padding:6px 11px 6px 26px;box-shadow:0 4px 14px rgba(20,22,26,.14);
  border-radius:16px;white-space:nowrap;cursor:pointer}
/* 2026-11-03: no position/transform here - they override Pannellum's absolute hotspot placement (hotspots ended up in the page flow, 730 px wide) */
.pnlm-panorama-info{display:none!important}.pnlm-controls-container{left:auto!important;right:16px;top:calc(16px + env(safe-area-inset-top,0px))!important}
.go::before{content:"";position:absolute;left:8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(194,162,86,.30)}
.note{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:7px 10px;font-size:11px;color:var(--muted);max-width:260px}
.pill{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--glass);box-shadow:0 8px 28px rgba(20,22,26,.14);
  color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font:13px var(--f-ui);cursor:pointer;min-height:36px}
.pill.on{border-color:var(--accent)}.pill:focus-visible,.roomsbtn:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.roomsbtn{position:fixed;z-index:6;right:16px;top:calc(64px + env(safe-area-inset-top,0px));background:var(--glass);color:var(--ink);box-shadow:0 8px 28px rgba(20,22,26,.12);
  border:1px solid var(--line);border-radius:6px;padding:7px 11px;font:13px var(--f-ui);cursor:pointer;min-height:36px}
.rooms{position:fixed;z-index:7;right:16px;top:calc(108px + env(safe-area-inset-top,0px));width:min(316px,calc(100% - 32px));max-height:calc(100% - 140px);overflow:auto;
  padding:8px;display:none;grid-template-columns:1fr 1fr;gap:8px}.rooms.open{display:grid}
.thumb{background:none;border:1px solid var(--line);border-radius:4px;padding:0;color:var(--ink);font:12px var(--f-ui);cursor:pointer;text-align:left}
.thumb img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:3px 3px 0 0}.thumb span{display:block;padding:4px 6px}
.thumb.on{border-color:var(--accent)}
@media (pointer:coarse){.roomsbtn{top:calc(108px + env(safe-area-inset-top,0px))}.rooms{top:calc(152px + env(safe-area-inset-top,0px))}}   /* phones: Pannellum adds a motion-sensor button under fullscreen */
@media (prefers-reduced-motion:reduce){.pnlm-container *{transition:none!important}}
@media (max-width:640px){.title{max-width:calc(100% - 128px)}.title h1{font-size:20px}.pill{left:auto;right:16px;transform:none;max-width:calc(100% - 210px);font-size:12px}.note{display:none}.map{width:min(170px,calc(100% - 32px))}.dot{width:20px;height:20px;margin:-10px 0 0 -10px}}
